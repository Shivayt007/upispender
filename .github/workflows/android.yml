name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --platforms=android --org com.upispender --project-name upispender .
      - name: Configure Android scheduled notifications
        run: python3 tool/configure_android.py
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Unit tests
        run: flutter test
      - name: Build unsigned-release-key APK (Android debug signing for sideloading)
        run: flutter build apk --release
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: UPI-Spend-Tracker-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
